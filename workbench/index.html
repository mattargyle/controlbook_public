<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controlbook Workbench</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <link rel="stylesheet" href="css/workbench.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>Controlbook Workbench</strong>
      <select id="study" aria-label="Design study"></select>
    </div>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Chapter"></nav>
    <div class="top-actions">
      <div id="mode"></div>
      <button id="theme" type="button" class="btn btn-quiet" aria-label="Toggle theme"></button>
      <button id="reset-all" type="button" class="btn btn-quiet" title="Reset all parameters (keeps saved answers)">Reset</button>
    </div>
  </header>

  <div class="chapter-bar">
    <h1 id="chapter-title"></h1>
    <span id="chapter-pages" class="page-ref"></span>
  </div>

  <main class="layout">
    <aside class="left-col" aria-label="Plant and simulation settings">
      <button id="left-toggle" type="button" class="collapse-btn" aria-controls="left" aria-expanded="true" title="Hide settings">
        <span class="collapse-icon" aria-hidden="true">‹</span><span class="collapse-text">Settings</span>
      </button>
      <div id="left" class="panel"></div>
    </aside>

    <aside class="panel right-col" aria-label="Controller and problem">
      <div id="right"></div>
      <div id="problem" class="problem card"></div>
    </aside>

    <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize the problem and plot panels" tabindex="0" title="Drag to resize · double-click to reset"></div>

    <section class="center">
      <div class="row-2">
        <div id="anim" class="card"></div>
        <div id="splane" class="card"></div>
      </div>
      <div id="bode" class="card" hidden></div>
      <div id="plot-y" class="plot-stack"></div>
      <div id="plot-u" class="card"></div>
      <div id="plot-x" class="card" hidden></div>
      <section class="math-wrap" aria-label="Math">
        <div class="math-head">
          <h2>Math</h2>
          <span class="muted small">General equations from the book, with links to the pages. In Work mode, a card that gives away an answer stays locked until you solve that part.</span>
        </div>
        <div id="math" class="math-grid"></div>
      </section>
    </section>
  </main>


  <script src="js/core/math.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/linalg.js"></script>
  <script src="js/core/place_yt.js"></script>
  <script src="js/core/tf.js"></script>
  <script src="js/core/plot.js"></script>
  <script src="js/core/sim.js"></script>
  <script src="js/core/design.js"></script>
  <script src="js/core/py.js"></script>
  <script src="js/core/yours.js"></script>
  <script src="js/systems/arm.js"></script>
  <script src="js/chapters/models.js"></script>
  <script src="js/chapters/pd.js"></script>
  <script src="js/chapters/pid.js"></script>
  <script src="js/chapters/ss.js"></script>
  <script src="js/chapters/freq.js"></script>
  <script src="js/studies/B/manifest.js"></script>
  <script src="js/studies/C/manifest.js"></script>
  <script src="js/studies/D/manifest.js"></script>
  <script src="js/studies/E/manifest.js"></script>
  <script src="js/studies/F/manifest.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
